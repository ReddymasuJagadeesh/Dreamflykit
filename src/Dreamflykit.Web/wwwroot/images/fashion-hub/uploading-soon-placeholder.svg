<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="fh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="fh-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#cbd5e1" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" fill="url(#fh-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#fh-dots)" rx="16" />
  <rect x="10" y="10" width="300" height="260" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4" rx="12" />

  <!-- Clothing / Fashion Icon -->
  <g transform="translate(132, 62)" stroke="#0284c7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hanger & T-shirt -->
    <path d="M28 6 L44 18 L38 28 L32 26 L32 50 L24 50 L24 26 L18 28 L12 18 Z" fill="#e0f2fe" opacity="0.8"/>
    <path d="M28 6 C28 3 24 3 24 6 C24 10 32 12 32 15" stroke-width="2"/>
    <circle cx="28" cy="2" r="1" fill="#0284c7"/>
  </g>

  <!-- Uploading Soon Pill Badge -->
  <rect x="75" y="150" width="170" height="30" rx="15" fill="url(#badge-grad)" />
  <text x="160" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
    ⏳ UPLOADING SOON
  </text>

  <!-- Info text -->
  <text x="160" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">
    Curated Student Fashion
  </text>
  <text x="160" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    Admin can upload image anytime
  </text>
</svg>
