<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#hero-grad)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <!-- Geometric decorative shapes -->
  <circle cx="1200" cy="250" r="180" fill="none" stroke="#2874f0" stroke-width="2" opacity="0.2" />
  <circle cx="1200" cy="250" r="240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Stylized Phones on the Right -->
  <g transform="translate(1080, 50)">
    <!-- Back phone -->
    <rect x="0" y="20" width="160" height="320" rx="30" fill="#0284c7" stroke="#38bdf8" stroke-width="3" opacity="0.85" />
    <rect x="15" y="40" width="60" height="120" rx="18" fill="#082f49" />
    <circle cx="45" cy="70" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="45" cy="115" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

    <!-- Front phone -->
    <g transform="translate(110, 40)">
      <rect x="0" y="0" width="170" height="340" rx="32" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
      <rect x="6" y="6" width="158" height="328" rx="26" fill="#020617" />
      <!-- Wallpaper glow -->
      <circle cx="85" cy="130" r="60" fill="#2874f0" opacity="0.6" />
      <text x="85" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="300" fill="#ffffff" text-anchor="middle">10:45</text>
      <!-- 3D badge -->
      <rect x="50" y="240" width="70" height="28" rx="14" fill="#fb641b" />
      <text x="85" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">3D LIVE</text>
    </g>
  </g>
</svg>
