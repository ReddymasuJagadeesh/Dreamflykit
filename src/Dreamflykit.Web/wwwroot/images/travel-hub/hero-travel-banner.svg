<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="60%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="700" height="450" rx="16" fill="url(#heroBg)"/>

  <!-- Flight Path Lines -->
  <path d="M50 380 Q 250 150 650 120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,8" fill="none" opacity="0.35"/>
  <circle cx="650" cy="120" r="4" fill="#38bdf8"/>

  <!-- Airplane Graphic -->
  <g transform="translate(380, 100) rotate(-15) scale(0.9)" filter="url(#heroShadow)">
    <path d="M0 0 L40 25 L120 20 L160 40 L120 45 L90 70 L70 70 L85 45 L30 45 L15 55 L5 55 L15 35 Z" fill="url(#planeGrad)" opacity="0.9"/>
  </g>

  <!-- Luggage & Travel Items Silhouette Artwork -->
  <g transform="translate(240, 180)" filter="url(#heroShadow)">
    <!-- Big Trolley -->
    <rect x="0" y="30" width="90" height="130" rx="12" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <line x1="25" y1="30" x2="25" y2="10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="30" x2="65" y2="10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="10" x2="70" y2="10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="70" x2="75" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="15" y1="110" x2="75" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="20" cy="165" r="6" fill="#38bdf8"/>
    <circle cx="70" cy="165" r="6" fill="#38bdf8"/>

    <!-- Small Cabin Trolley -->
    <rect x="105" y="65" width="70" height="95" rx="10" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="120" cy="165" r="5" fill="#fbbf24"/>
    <circle cx="160" cy="165" r="5" fill="#fbbf24"/>

    <!-- Backpack -->
    <path d="M190 160 C185 100 235 90 240 160 Z" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>

    <!-- Neck Pillow -->
    <path d="M-40 135 C-50 110 -20 95 -5 115 C5 130 -10 155 -30 155 C-45 155 -45 145 -40 135 Z" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Uploading Soon Central Badge -->
  <g transform="translate(230, 290)">
    <rect width="240" height="42" rx="21" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#heroShadow)"/>
    <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">📷 UPLOADING SOON</text>
  </g>

  <!-- Super Admin Hint -->
  <text x="350" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">
    Super Admin Replaceable
  </text>
  <text x="350" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Admin panel can upload/replace hero banner anytime from dashboard
  </text>
</svg>