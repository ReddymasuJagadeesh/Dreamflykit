<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 260" width="100%" height="100%">
  <defs>
    <linearGradient id="luggBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="60%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#091e36" />
    </linearGradient>
    <filter id="luggShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="350" height="260" rx="14" fill="url(#luggBg)"/>
  
  <rect x="20" y="20" width="310" height="220" rx="10" fill="none" stroke="#f97316" stroke-opacity="0.3" stroke-dasharray="5,5" stroke-width="1.5"/>

  <!-- Trolley Outline -->
  <g transform="translate(145, 55)" filter="url(#luggShadow)">
    <rect x="0" y="20" width="60" height="85" rx="8" fill="#f97316" fill-opacity="0.25" stroke="#fb923c" stroke-width="2"/>
    <line x1="16" y1="20" x2="16" y2="5" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="20" x2="44" y2="5" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="5" x2="48" y2="5" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="48" x2="50" y2="48" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="10" y1="75" x2="50" y2="75" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <circle cx="14" cy="110" r="4" fill="#fb923c"/>
    <circle cx="46" cy="110" r="4" fill="#fb923c"/>
  </g>

  <!-- Uploading Soon Badge -->
  <g transform="translate(95, 175)">
    <rect width="160" height="32" rx="16" fill="#f97316" filter="url(#luggShadow)"/>
    <text x="80" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">UPLOADING SOON</text>
  </g>

  <text x="175" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Super Admin Replaceable
  </text>
</svg>