services:
  # ============================================================================
  # Dreamflykit Web Application (.NET 8 Production Service)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dreamflykit-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-Host=db;Port=5432;Database=dreamflykit;Username=dreamfly_user;Password=replace_with_strong_password_in_production}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379,abortConnect=false}
      - Media__CdnBaseUrl=${Media__CdnBaseUrl}
      - Media__BucketName=${Media__BucketName}
      - Media__AwsRegion=${Media__AwsRegion}
      - AwsS3__BucketName=${AwsS3__BucketName}
      - AwsS3__Region=${AwsS3__Region}
      - AwsS3__AccessKeyId=${AwsS3__AccessKeyId}
      - AwsS3__SecretAccessKey=${AwsS3__SecretAccessKey}
      - AwsS3__SessionToken=${AwsS3__SessionToken}
      - EmailSettings__SmtpHost=${EmailSettings__SmtpHost}
      - EmailSettings__SmtpPort=${EmailSettings__SmtpPort:-587}
      - EmailSettings__Username=${EmailSettings__Username}
      - EmailSettings__Password=${EmailSettings__Password}
      - EmailSettings__EnableSsl=${EmailSettings__EnableSsl:-true}
      - EmailSettings__FromEmail=${EmailSettings__FromEmail:-noreply@dreamflykit.com}
      - EmailSettings__FromName=${EmailSettings__FromName:-Dreamflykit}
      - Cashfree__AppId=${Cashfree__AppId}
      - Cashfree__SecretKey=${Cashfree__SecretKey}
      - Cashfree__Environment=${Cashfree__Environment:-PRODUCTION}
    volumes:
      - media_cache:/app/App_Data/MediaCache
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - dreamflykit-net

  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: dreamflykit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamflykit}
      POSTGRES_USER: ${POSTGRES_USER:-dreamfly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_strong_password_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - dreamflykit-net

  # ============================================================================
  # Redis 7 Distributed Caching Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: dreamflykit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dreamflykit-net

# ==============================================================================
# Persistent Storage Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    name: dreamflykit_pgdata
  redis_data:
    name: dreamflykit_redisdata
  media_cache:
    name: dreamflykit_media_cache
  uploads_data:
    name: dreamflykit_uploads_data

networks:
  dreamflykit-net:
    driver: bridge
