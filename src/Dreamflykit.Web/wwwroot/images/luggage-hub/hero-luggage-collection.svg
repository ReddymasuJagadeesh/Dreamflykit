<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ec" />
      <stop offset="40%" stop-color="#fae8d8" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f2b48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="750" height="480" rx="16" fill="url(#heroSky)"/>

  <!-- Airplane Flight Trail -->
  <path d="M100 400 Q 350 180 700 80" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8,8" fill="none" opacity="0.45"/>
  <circle cx="700" cy="80" r="5" fill="#f97316"/>

  <!-- Airplane Silhouette -->
  <g transform="translate(560, 90) rotate(-22) scale(0.9)" filter="url(#hShadow)">
    <path d="M0 0 L35 20 L100 18 L140 35 L100 40 L70 65 L50 65 L65 40 L25 40 L12 50 L2 50 L12 30 Z" fill="#0f2b48" opacity="0.85"/>
  </g>

  <!-- Luggage Set Graphic (Hard Luggage + Duffel + Backpack) -->
  <g transform="translate(260, 160)" filter="url(#hShadow)">
    <!-- Blue Spinner 28" -->
    <rect x="0" y="30" width="110" height="170" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <line x1="30" y1="30" x2="30" y2="5" stroke="#0f2b48" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="30" x2="80" y2="5" stroke="#0f2b48" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="5" x2="85" y2="5" stroke="#0f2b48" stroke-width="5" stroke-linecap="round"/>
    <circle cx="25" cy="206" r="7" fill="#0f2b48"/>
    <circle cx="85" cy="206" r="7" fill="#0f2b48"/>

    <!-- Silver Medium Spinner 24" -->
    <rect x="125" y="65" width="95" height="135" rx="12" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="145" cy="206" r="6" fill="#0f2b48"/>
    <circle cx="195" cy="206" r="6" fill="#0f2b48"/>

    <!-- Navy Duffel Bag with Dreamflykit logo -->
    <g transform="translate(45, 130)">
      <rect x="0" y="0" width="150" height="70" rx="20" fill="#0f2b48" stroke="#f97316" stroke-width="2"/>
      <path d="M40 0 C40 -20 110 -20 110 0" stroke="#f97316" stroke-width="3" fill="none"/>
      <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">DREAMFLYKIT</text>
    </g>

    <!-- Black Tech Backpack -->
    <path d="M230 200 C220 110 280 100 290 200 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Uploading Soon Central Badge -->
  <g transform="translate(255, 385)">
    <rect width="240" height="42" rx="21" fill="#0f2b48" stroke="#f97316" stroke-width="2" filter="url(#hShadow)"/>
    <text x="120" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">📷 UPLOADING SOON</text>
  </g>

  <text x="375" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f2b48" text-anchor="middle">
    Super Admin Replaceable • Upload Hero Luggage Banner Anytime
  </text>
</svg>