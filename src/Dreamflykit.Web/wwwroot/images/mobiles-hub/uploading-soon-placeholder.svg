<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="mob-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="mob-badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2874f0" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="phone-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <pattern id="mob-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#93c5fd" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" fill="url(#mob-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#mob-dots)" rx="16" />
  <rect x="10" y="10" width="300" height="300" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4" rx="12" />

  <!-- Stylized 3D Smartphone Illustration -->
  <g transform="translate(125, 40)">
    <!-- Phone Chassis -->
    <rect x="0" y="0" width="70" height="130" rx="14" fill="url(#phone-body-grad)" stroke="#1d4ed8" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(37,99,235,0.25))" />
    <!-- Screen -->
    <rect x="4" y="4" width="62" height="122" rx="10" fill="#0f172a" />
    <!-- Screen Wallpaper Glow -->
    <circle cx="35" cy="50" r="22" fill="#60a5fa" opacity="0.4" />
    <!-- Camera Island Pill -->
    <rect x="25" y="8" width="20" height="5" rx="2.5" fill="#1e293b" />
    <circle cx="35" cy="10.5" r="1.8" fill="#38bdf8" />
    <!-- Home bar -->
    <line x1="25" y1="120" x2="45" y2="120" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- 3D rotation badge indicator -->
    <circle cx="60" cy="20" r="12" fill="#fb641b" />
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">3D</text>
  </g>

  <!-- Uploading Soon Pill Badge -->
  <rect x="70" y="195" width="180" height="32" rx="16" fill="url(#mob-badge-grad)" filter="drop-shadow(0 4px 10px rgba(40,116,240,0.3))" />
  <text x="160" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
    ⏳ UPLOADING SOON
  </text>

  <!-- Info text -->
  <text x="160" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    Mobile Phone Image
  </text>
  <text x="160" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#3b82f6" text-anchor="middle">
    Admin can upload 2D/3D phone anytime
  </text>
</svg>
