<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="50%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- Inner glowing box -->
  <rect x="30" y="30" width="340" height="240" rx="12" fill="url(#glowGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-dasharray="6,6" stroke-width="1.5"/>

  <!-- Travel / Cloud Upload Icon -->
  <g transform="translate(170, 75)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="32" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <path d="M20 36 L40 36 M30 18 L30 36 M24 24 L30 18 L36 24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 28 C14 26 14 22 17 20 C18 16 22 14 26 16 C28 13 33 13 36 15 C39 13 44 15 44 19 C47 21 46 26 44 28" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Uploading Soon Pill -->
  <g transform="translate(120, 160)">
    <rect width="160" height="34" rx="17" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">UPLOADING SOON</text>
  </g>

  <!-- Subtitle -->
  <text x="200" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Super Admin Replaceable
  </text>
  <text x="200" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
    Admin panel can upload/replace image anytime
  </text>
</svg>