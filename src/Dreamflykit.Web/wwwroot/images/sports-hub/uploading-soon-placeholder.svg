<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="50%" stop-color="#dcfce7" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="sp-badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sp-ball-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <pattern id="sp-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#86efac" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" fill="url(#sp-bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#sp-dots)" rx="16" />
  <rect x="10" y="10" width="300" height="300" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4" rx="12" />

  <!-- Stylized Sports Icon & Equipment Illustration -->
  <g transform="translate(160, 105)">
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.6" />
    <!-- Center Emblem -->
    <circle cx="0" cy="0" r="24" fill="url(#sp-ball-grad)" filter="drop-shadow(0 6px 14px rgba(5,150,105,0.25))" />
    <text x="0" y="8" font-size="24" text-anchor="middle">⚽</text>
  </g>

  <!-- Uploading Soon Pill Badge -->
  <rect x="65" y="195" width="190" height="32" rx="16" fill="url(#sp-badge-grad)" filter="drop-shadow(0 4px 10px rgba(5,150,105,0.3))" />
  <text x="160" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
    ⏳ UPLOADING SOON
  </text>

  <!-- Info text -->
  <text x="160" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">
    Sports Hub Tournament Asset
  </text>
  <text x="160" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">
    Admin can upload match equipment anytime
  </text>
</svg>

