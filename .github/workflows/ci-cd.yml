name: Dreamflykit CI/CD Pipeline

on:
  push:
    branches: [ navbar, main, master ]
  pull_request:
    branches: [ navbar, main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore ./Dreamflykit/Dreamflykit.slnx

      - name: Compile Solution (Release Mode)
        run: dotnet build ./Dreamflykit/Dreamflykit.slnx -c Release --no-restore

      - name: Execute Automated Test Suite (188 Tests)
        run: dotnet test ./Dreamflykit/Dreamflykit.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Scan NuGet Packages for CVE Vulnerabilities
        run: dotnet list ./Dreamflykit/Dreamflykit.slnx package --vulnerable --include-transitive

  deploy-vps:
    name: Deploy to Hostinger Production VPS
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/navbar' || github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        if: env.HOSTINGER_SSH_HOST != ''
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "Starting Dreamflykit automated deployment..."
            cd /opt/dreamflykit || cd ~/dreamflykit

            echo "Pulling latest code changes..."
            git pull origin ${{ github.ref_name }}

            echo "Rebuilding and updating containers..."
            docker compose up -d --build --remove-orphans

            echo "Verifying application health..."
            sleep 15
            for i in {1..10}; do
              if curl -f http://localhost:8080/health; then
                echo "Dreamflykit application is HEALTHY!"
                exit 0
              fi
              echo "Waiting for container startup... ($i/10)"
              sleep 5
            done

            echo "Container health check failed!"
            docker compose logs --tail=50 web
            exit 1

