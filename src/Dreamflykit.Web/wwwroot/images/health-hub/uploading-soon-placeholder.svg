<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="hh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="50%" stop-color="#e6f7f2" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="hh-badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d7a5f" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="hh-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#a7f3d0" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" fill="url(#hh-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#hh-dots)" rx="16" />
  <rect x="10" y="10" width="300" height="260" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6 4" rx="12" />

  <!-- Pharmacy Cross & Capsule Icon -->
  <g transform="translate(136, 52)" stroke="#0d7a5f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Medical Cross Shield -->
    <rect x="4" y="0" width="40" height="40" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <path d="M24 10 L24 30 M14 20 L34 20" stroke="#0d7a5f" stroke-width="3.5" stroke-linecap="round" />
    <!-- Capsule Pill -->
    <g transform="translate(0, 48)">
      <rect x="10" y="0" width="28" height="14" rx="7" fill="#10b981" stroke="#047857" stroke-width="1.5" />
      <path d="M24 0 L24 14" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>

  <!-- Uploading Soon Pill Badge -->
  <rect x="75" y="146" width="170" height="30" rx="15" fill="url(#hh-badge-grad)" />
  <text x="160" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
    ⏳ UPLOADING SOON
  </text>

  <!-- Info text -->
  <text x="160" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">
    Healthcare &amp; Medicine
  </text>
  <text x="160" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">
    Admin can upload image anytime
  </text>
</svg>
