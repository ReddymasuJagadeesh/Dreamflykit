<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 650" width="1920" height="650">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14361c"/>
      <stop offset="50%" stop-color="#1e4d29"/>
      <stop offset="100%" stop-color="#2a6637"/>
    </linearGradient>
    <radialGradient id="glowG" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14361c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="650" fill="url(#bgG)"/>
  <rect width="1920" height="650" fill="url(#glowG)"/>

  <!-- Decorative food graphics on right side -->
  <g transform="translate(1100, 80)">
    <!-- Grocery Basket Outline & Silhouette -->
    <rect x="250" y="160" width="460" height="280" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <path d="M 280 160 Q 480 30 680 160" fill="none" stroke="#fcd34d" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bag of Atta Flour -->
    <rect x="300" y="190" width="130" height="200" rx="16" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/>
    <text x="365" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#854d0e" text-anchor="middle">ATTA</text>
    <text x="365" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">100% WHEAT</text>
    <circle cx="365" cy="340" r="22" fill="#ca8a04" fill-opacity="0.3"/>

    <!-- Bottle of Oil -->
    <path d="M 455 240 L 455 385 Q 455 395 465 395 L 505 395 Q 515 395 515 385 L 515 240 L 495 210 L 475 210 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
    <rect x="475" y="190" width="20" height="20" rx="4" fill="#b45309"/>
    <text x="485" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#78350f" text-anchor="middle">PURE</text>
    <text x="485" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">OIL</text>

    <!-- Tea Pack -->
    <rect x="535" y="210" width="130" height="180" rx="14" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <text x="600" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">CHAI</text>
    <text x="600" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fee2e2" text-anchor="middle">LEAF TEA</text>
    <circle cx="600" cy="345" r="16" fill="#fef08a"/>

    <!-- Wheat stalks -->
    <path d="M 230 420 Q 210 280 270 200" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="270" cy="195" rx="14" ry="7" fill="#fef08a" transform="rotate(-30 270 195)"/>
    <ellipse cx="255" cy="225" rx="14" ry="7" fill="#fef08a" transform="rotate(-40 255 225)"/>
    <ellipse cx="240" cy="260" rx="14" ry="7" fill="#fef08a" transform="rotate(-50 240 260)"/>
  </g>
</svg>