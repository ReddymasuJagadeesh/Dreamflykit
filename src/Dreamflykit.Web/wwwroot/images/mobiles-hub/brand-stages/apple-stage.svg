<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="100%" height="100%">
  <defs>
    <!-- Podium Gradients -->
    <linearGradient id="goldRim-apple-stage.svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="podiumBase-apple-stage.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Phone Chassis Gradient -->
    <linearGradient id="phoneBody-apple-stage.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screenGrad-apple-stage.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow-apple-stage.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <radialGradient id="podiumAura-apple-stage.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Stage Aura Light -->
  <ellipse cx="140" cy="240" rx="100" ry="24" fill="url(#podiumAura-apple-stage.svg)" />

  <!-- DUAL SMARTPHONES (Large, prominent showcase) -->
  <!-- Left Phone: Rear view angled -->
  <g transform="translate(68, 20) rotate(-4, 60, 100)" filter="url(#shadow-apple-stage.svg)">
    <!-- Chassis -->
    <rect x="0" y="0" width="76" height="152" rx="15" fill="url(#phoneBody-apple-stage.svg)" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.4" />
    <!-- Rear Camera Island based on Brand Signature -->    <rect x="6" y="8" width="34" height="36" rx="10" fill="#000000" opacity="0.25" />
    <circle cx="16" cy="18" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="18" r="3" fill="#38bdf8" />
    <circle cx="28" cy="30" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="28" cy="30" r="3" fill="#38bdf8" />    <!-- Subtle phone sheen line -->
    <line x1="20" y1="135" x2="56" y2="135" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- Right Phone: Front display facing forward -->
  <g transform="translate(132, 12)" filter="url(#shadow-apple-stage.svg)">
    <!-- Chassis border -->
    <rect x="0" y="0" width="78" height="156" rx="16" fill="#090d16" stroke="#ffffff" stroke-width="1.5" />
    <!-- Screen Wallpaper -->
    <rect x="3" y="3" width="72" height="150" rx="13" fill="url(#screenGrad-apple-stage.svg)" />
    <!-- Screen Bezel Shine -->
    <path d="M 6 3 L 72 3" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" />
    <!-- Punch Hole Camera -->
    <circle cx="39" cy="9" r="2.2" fill="#000000" stroke="#475569" stroke-width="0.6" />
    <!-- Digital Time / Lockscreen -->
    <text x="39" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="300" fill="#ffffff" text-anchor="middle">10:45</text>
    <!-- Brand badge on screen -->
    <rect x="18" y="112" width="42" height="14" rx="7" fill="#ffffff" fill-opacity="0.9" />
    <text x="39" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#0f172a" text-anchor="middle">iPhone</text>
    <!-- Home bar -->
    <rect x="26" y="146" width="26" height="2" rx="1" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 3D LUXURY GOLD & PURPLE STAGE PODIUM (Flipkart Stage Style) -->
  <g transform="translate(140, 240)">
    <!-- Stage Base Cylinder (Purple/Violet metallic) -->
    <ellipse cx="0" cy="20" rx="100" ry="16" fill="#1e1035" />
    <path d="M -98 10 C -98 22 98 22 98 10 L 98 20 C 98 32 -98 32 -98 20 Z" fill="url(#podiumBase-apple-stage.svg)" />
    <ellipse cx="0" cy="18" rx="98" ry="12" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.6" />

    <!-- Gold Middle Bevel Ring -->
    <path d="M -104 2 C -104 14 104 14 104 2 L 104 8 C 104 20 -104 20 -104 8 Z" fill="url(#goldRim-apple-stage.svg)" />

    <!-- Top Metallic Platform Surface -->
    <ellipse cx="0" cy="2" rx="104" ry="13" fill="url(#goldRim-apple-stage.svg)" />
    <!-- Inner Stage Inset (Mirror reflective disc) -->
    <ellipse cx="0" cy="0" rx="94" ry="10" fill="#2e1065" stroke="#fef08a" stroke-width="1.2" />

    <!-- Mirror reflection of the phones on stage surface -->
    <ellipse cx="0" cy="-1" rx="60" ry="6" fill="#ffffff" opacity="0.15" />
  </g>
</svg>
